[groups.extras]
label = "Shows and extras"
rides = [
  "*show*", "*meet & greet*", "*photo*", "*soft play*", "*restaurant*", "*encounter*", "*play area*",
  "Final Exhibit", "Wanyama Village", "Brick Ice Lolly", "The Gardens", "Something Special Sensory Garden",
]
